{% extends "base.html" %}
{% block title %}Log in · PhishGuard{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post" autocomplete="off">
    {{ form.csrf_token }}
    <label>{{ form.username.label.text }} {{ form.username(autocomplete="username") }}</label>
    <label>{{ form.password.label.text }} {{ form.password(autocomplete="current-password") }}</label>
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
