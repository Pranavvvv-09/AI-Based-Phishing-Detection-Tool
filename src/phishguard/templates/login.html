{% extends "base.html" %}
{% block title %}Log in · PhishGuard{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post" action="/login" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>User name <input id="username" name="username" required maxlength="100" autocomplete="username"></label>
    <label>Password <input id="password" name="password" type="password" required maxlength="200" autocomplete="current-password"></label>
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
