{#- Explanation chips: red pushes towards phishing, green towards legitimate;
    solid = strong (|weight| >= 2), tinted = medium (>= 1), outline = weak. -#}
<div class="chips">{% for r in reasons[:limit] %}<span class="{{ r.weight|chip }}" title="{{ r.detail }}">{{ r.code }} {{ "%+.1f"|format(r.weight) }}</span>{% endfor %}</div>
