{% extends "base.html" %}
{% block content %}
<div class="grid">
  <section class="card">
    <h1>Scan an email</h1>
    <form method="post" action="/scan/email" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <label>.eml file <input id="eml" name="eml" type="file" accept=".eml,message/rfc822" required></label>
      <button type="submit">Scan email</button>
    </form>
    <p class="hint">Headers, links and attachments are checked without opening anything.</p>
  </section>
  <section class="card">
    <h1>Scan an SMS</h1>
    <form method="post" action="/scan/sms">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <label>SMS text <textarea id="sms-text" name="text" rows="4" required maxlength="5000">{{ sms_text or "" }}</textarea></label>
      <label>Sender (optional) <input id="sms-sender" name="sender" maxlength="100" value="{{ sms_sender or "" }}" placeholder="e.g. VM-HDFCBK-S or +91 98xxx xxxxx"></label>
      <button type="submit">Scan SMS</button>
    </form>
  </section>
</div>
{% if verdict %}{% include "_verdict.html" %}{% endif %}
{% endblock %}
