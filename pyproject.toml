[build-system]
requires = ["setuptools>=78.1.1"]  # 78.1.1 fixes PYSEC-2025-49
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.1.0"
description = "Explainable AI phishing detector for email and SMS with automatic quarantine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0",
    "tldextract>=5.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2",
    "werkzeug>=3.0",  # password hashing (ADMIN_PASSWORD_HASH format)
]
ocr = [  # Quick Scan of SMS screenshots; OCR models ship in the wheel, so it stays offline
    "rapidocr>=3.10",
    "onnxruntime>=1.20",
    "pillow>=11",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",  # FastAPI TestClient
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishguard = ["templates/*.html", "static/*.css", "static/*.svg", "static/*.js", "static/app/*.html", "static/app/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # starlette's TestClient uses an anyio alias deprecated upstream; not our code
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # starlette >= 1.7 prefers httpx2 for its TestClient but still supports httpx (the
    # only option on older versions); revisit when starlette drops httpx
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["phishguard"]

[tool.coverage.report]
# Measured without the datasets/models (as in CI): 92%. The floor leaves some headroom.
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: imports, B: bugbear, UP: modern syntax, S: bandit security rules
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]  # asserts and fake test credentials

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
