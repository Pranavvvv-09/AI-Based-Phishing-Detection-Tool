# Lint, security checks, tests and a dependency audit on every push and pull request.
# Runs without the datasets or trained models: tests that need them skip themselves.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]  # oldest supported and newest
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[web,dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Security lint (bandit)
        run: bandit -q -c pyproject.toml -r src

      - name: Tests with coverage
        run: python -m pytest --cov=phishguard --cov-report=term-missing:skip-covered

      - name: Dependency audit (pip-audit)
        run: pip-audit --skip-editable --progress-spinner off
